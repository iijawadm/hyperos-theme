<svg xmlns="http://www.w3.org/2000/svg" width="64" height="64" viewBox="0 0 64 64">
  <defs>
    <linearGradient id="backGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFB938"/>
      <stop offset="100%" stop-color="#E67E17"/>
    </linearGradient>
    <linearGradient id="frontGrad" x1="15%" y1="0%" x2="85%" y2="100%">
      <stop offset="0%" stop-color="#FFD05B"/>
      <stop offset="52%" stop-color="#FFA229"/>
      <stop offset="100%" stop-color="#F07B16"/>
    </linearGradient>
    <linearGradient id="glassSheen" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFFFFF" stop-opacity="0.34"/>
      <stop offset="42%" stop-color="#FFFFFF" stop-opacity="0.06"/>
      <stop offset="100%" stop-color="#000000" stop-opacity="0.06"/>
    </linearGradient>
    <filter id="dropShadow" x="-10%" y="-10%" width="120%" height="125%">
      <feDropShadow dx="0" dy="2" stdDeviation="1.8" flood-color="#000000" flood-opacity="0.24"/>
    </filter>
  </defs>
  <g filter="url(#dropShadow)">
    <!-- Back plate with rounded HyperOS tab -->
    <path d="M 11.5,10.5 H 24.8 C 27.2,10.5 29.0,11.6 30.6,13.6 L 32.2,15.5 H 52.5 C 56.2,15.5 58.8,18.1 58.8,21.8 V 48.0 C 58.8,52.4 55.6,55.5 51.2,55.5 H 12.8 C 8.4,55.5 5.2,52.4 5.2,48.0 V 16.8 C 5.2,13.1 7.8,10.5 11.5,10.5 Z" fill="url(#backGrad)"/>
    <!-- Subtle inner sheet / HyperOS depth layer -->
    <rect x="10.5" y="17.5" width="43" height="6" rx="3" fill="#FFF8E7" fill-opacity="0.42"/>
    <!-- Front rounded squircle flap -->
    <path d="M 11.5,20.5 H 52.5 C 56.4,20.5 59.0,23.1 59.0,27.0 V 48.5 C 59.0,52.8 55.8,56.0 51.5,56.0 H 12.5 C 8.2,56.0 5.0,52.8 5.0,48.5 V 27.0 C 5.0,23.1 7.6,20.5 11.5,20.5 Z" fill="url(#frontGrad)"/>
    <!-- Frosted specular sheen -->
    <path d="M 11.5,20.5 H 52.5 C 56.4,20.5 59.0,23.1 59.0,27.0 V 48.5 C 59.0,52.8 55.8,56.0 51.5,56.0 H 12.5 C 8.2,56.0 5.0,52.8 5.0,48.5 V 27.0 C 5.0,23.1 7.6,20.5 11.5,20.5 Z" fill="url(#glassSheen)"/>
    <!-- Crisp top rim highlight -->
    <path d="M 11.5,21.1 H 52.5" stroke="#FFFFFF" stroke-opacity="0.45" stroke-width="1.1" stroke-linecap="round" fill="none"/>
  </g>
  <g fill="none" stroke="#FFFFFF" stroke-opacity="0.90" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"><rect x="24" y="29.5" width="16" height="18" rx="2.5"/><line x1="28" y1="35" x2="36" y2="35"/><line x1="28" y1="39.5" x2="36" y2="39.5"/><line x1="28" y1="43.5" x2="33" y2="43.5"/></g>
</svg>
